name: Migration validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'migration/avalonia/**'

permissions:
  contents: read

jobs:
  core-and-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests and Avalonia build
        shell: pwsh
        run: ./scripts/test-all.ps1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
